<div class="container">
		<div class="row">
			<div class="col-md-6 col-xs-10 col-xs-offset-1 col-md-offset-3 margintop">
                            <center><img ng-src="assets/images/logo.png" class="logo" alt="Minyanim"></center>
                        <form class="form-style" name="loginForm" ng-controller="LoginController as ingresar" ng-submit="loginForm.$valid && ingresar.crearSesion(loginForm)" novalidate>
                            <div ng-repeat="alert in alerts" type="alert.type" class="alert alert-{{alert.type}}">
                                <strong>{{ alert.msg }}</strong>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" ng-model="ingresar.user.email" id="correo" name="correo" placeholder="Email" class="form-control" data-error="Invalid email" required>
                                <span ng-show="loginForm.correo.$dirty && loginForm.correo.$touched
                                && !loginForm.correo.$valid && !loginForm.correo.$pristine">Invalid entry.</span>
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" ng-model="ingresar.user.password" id="contra"
                                name="contra" placeholder="Password" class="form-control" data-error="Please, write your password" ng-minlength="6" required>
                                <span ng-show="loginForm.contra.$dirty && loginForm.contra.$touched
                                && !loginForm.contra.$valid && !loginForm.contra.$pristine">Invalid entry</span>
                            </div>

                            <br>
                            <button type="submit" class="btn btn-lg btn-block btn-oscuro" ng-disabled="!loginForm.$valid || mylogin.loading"><i ng-show="mylogin.loading" class="fa fa-circle-o-notch fa-spin"></i> Sign in</button></br>
                            <a class="btn btn-lg btn-block btn-claro" ui-sref="registrar"> Create account</a>
                            <a class="btn btn-lg btn-block btn-claro" ui-sref="forgotPassword">Forgot password</a><br/>
                        </form>
                    </div>
                </div>
</div>
