<div class="container" ng-controller="ForgotPasswordController as fpCtrl">
		<div class="row">
			<div class="col-md-6 col-md-offset-3">
                <div class="row">
                        <div class="page-header">
                            <h1>Ingresa tu correo</h1>
                        </div>
                    <div class="col-md-12 well">
                        <form class="form-style" name="passwordForm" ng-submit="passwordForm.$valid && fpCtrl.sendPasswordEmail(passwordForm)" novalidate>
                            <div ng-repeat="alert in alerts" type="alert.type" class="alert alert-{{alert.type}}">
                                <strong>{{ alert.msg }}</strong>
                            </div>
                            <div class="form-group">
                                <label>Correo electrónico</label>
                                <input type="email" ng-model="fpCtrl.email" id="correo" name="correo" placeholder="Correo electrónico" class="form-control" data-error="Correo no valido" required>
                                <span ng-show="passwordForm.correo.$dirty && passwordForm.correo.$touched
                                && !passwordForm.correo.$valid && !passwordForm.correo.$pristine">Entrada invalida.</span>
                            </div>
                            <center><button type="submit" ng-show="passwordForm.$valid || fpCtrl.loading"  class="btn btn-lg btn-oscuro" ng-disabled="fpCtrl.loading"><i ng-show="fpCtrl.loading" class="fa fa-circle-o-notch fa-spin"></i> Restaurar mi contraseña</button></center>
                        </form>
                    </div>
                </div>
			</div>
	    </div>
</div>
