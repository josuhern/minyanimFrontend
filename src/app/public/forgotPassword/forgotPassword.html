<div class="container" ng-controller="ForgotPasswordController as fpCtrl">
		<div class="row">
			<div class="col-md-6 col-md-offset-3">
                    <div class="page-header">
                        <h1>Forgot password?</h1>
                    </div>
                    <div class="col-md-12 well">
                        <form class="form-style" name="passwordForm" ng-submit="passwordForm.$valid && fpCtrl.sendPasswordEmail(passwordForm)" novalidate>
                            <div ng-repeat="alert in alerts" type="alert.type" class="alert alert-{{alert.type}}">
                                <strong>{{ alert.msg }}</strong>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" ng-model="fpCtrl.email" id="correo" name="correo" placeholder="Email" class="form-control" data-error="Correo no valido" required>
                                <span ng-show="passwordForm.correo.$dirty && passwordForm.correo.$touched
                                && !passwordForm.correo.$valid && !passwordForm.correo.$pristine">That is not a valid email</span>
                            </div>
                            <center><button type="submit" ng-show="passwordForm.$valid || fpCtrl.loading"  class="btn btn-lg btn-oscuro" ng-disabled="fpCtrl.loading"><i ng-show="fpCtrl.loading" class="fa fa-circle-o-notch fa-spin"></i> Send me a new password</button></center>
                        </form>
                    </div>
            </div>
            <div class="col-md-12">
                <a ui-sref="login" class="btn btn-danger"><i class="fa fa-arrow-left"></i> Back</a>
            </div>
	    </div>
</div>
