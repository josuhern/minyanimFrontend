<div class="container" ng-controller="RegisterController as registerCtrl" ng-init="registerCtrl.initRegisterUser()">
    <div class="row">
      <div class="col-md-12">
        <div class="page-header">
          <center>
            <h1><i class="fa fa-users"></i><br> Thanks for join us! <br><small>You will be added to {{registerCtrl.editSite.name}}</small></h1>
          </center>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <form class="form-style" name="userForm" ng-submit="userForm.$valid && registerCtrl.saveUser(userForm)" novalidate>
          <div ng-repeat="alert in alerts" type="alert.type" class="alert alert-{{alert.type}}">
            <strong>{{ alert.msg }}</strong>
          </div>
          <div class="col-md-6">
            <div class="form-group required">
              <label>First name</label>
              <input type="text" ng-model="registerCtrl.newUser.name" id="name" name="name" placeholder="First name" class="form-control" data-error="Please, write a name" required />
              <span ng-show="userForm.name.$dirty && userForm.name.$touched && !userForm.name.$valid && !userForm.name.$pristine">Please, write a name.</span>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group required">
              <label>Last name</label>
              <input type="text" ng-model="registerCtrl.newUser.lastname" id="lastname" name="lastname" placeholder="Last name" class="form-control" data-error="Plase, write a lastname" required/>
              <span ng-show="userForm.lastname.$dirty && userForm.lastname.$touched && !userForm.lastname.$valid && !userForm.lastname.$pristine">Plase, write a lastname</span>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group required">
              <label>Email</label>
              <input type="email" ng-model="registerCtrl.newUser.email" id="email" name="email" placeholder="Email" class="form-control" data-error="That is not a valid email" required/>
              <span ng-show="userForm.email.$dirty && userForm.email.$touched && !userForm.email.$valid && !userForm.email.$pristine">That is not a valid email.</span>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group required">
              <label>Phone</label>
              <input type="text" ng-model="registerCtrl.newUser.phone" id="phone" name="phone" placeholder="Phone" class="form-control" data-error="Please, write a phone number" required ng-intl-tel-input/>
              <span ng-show="userForm.phone.$dirty && userForm.phone.$touched && !userForm.phone.$valid && !userForm.phone.$pristine">Please, write a phone number.</span>
            </div>
          </div>
          <center>
            <button ng-show="userForm.$valid || registerCtrl.loading" class="btn btn-oscuro" ng-disabled="registerCtrl.loading"><i ng-show="registerCtrl.loading" class="fa fa-circle-o-notch fa-spin"></i>Save</button>
          </center>
        </form>
      </div>
      <div class="col-md-12">
        <a ui-sref="findSynagogue" class="btn btn-danger"><i class="fa fa-arrow-left"></i> Back</a>
      </div>
    </div>
  </div>
