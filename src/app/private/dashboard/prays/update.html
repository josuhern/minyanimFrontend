<div id="main" ng-controller="PraysController as PrayCtrl" ng-init="PrayCtrl.getPray()">
    <div class="row">
        <div class="col-md-12">
            <div class="page-header">
                <center><h2><i class="fas fa-clock"></i> Edit {{PrayCtrl.editPray.name}}</h2></center>
            </div>
        </div>
        <div class="col-md-12">
            <form class="form-style" name="prayForm" ng-submit="prayForm.$valid && PrayCtrl.updatePray(prayForm)" novalidate>
                <div ng-repeat="alert in alerts" type="alert.type" class="alert alert-{{alert.type}}"><strong>{{ alert.msg }}</strong></div>
                    <div class="col-md-12">
                      <div class="form-group">
                        <label for="special">This is an special appointment?</label>
                        <div class="form-group">
                          <label class="switch">
                              <input type="checkbox" ng-model="PrayCtrl.editPray.special" id="special" name="special" class="form-control">
                              <div class="slider round"></div>
                          </label>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-12">
                      <div class="form-group required">
                        <label for="name">Name</label>
                        <input
                          type="text"
                          ng-model="PrayCtrl.editPray.name"
                          placeholder="Name"
                          class="form-control"
                          id="name"
                          name="name"
                          data-error="Please, Write a name"
                          required
                        />
                        <span
                          ng-show="PrayForm.name.$dirty && PrayForm.name.$touched && !PrayForm.name.$valid && !PrayForm.name.$pristine"
                          >Please, Write a name.</span
                        >
                      </div>
                    </div>
                    <div class="col-md-12" ng-if="PrayCtrl.editPray.special">
                      <div class="form-group required">
                        <label for="description">Description</label>
                        <textarea
                          type="text"
                          ng-model="PrayCtrl.editPray.description"
                          placeholder="Description"
                          class="form-control"
                          id="description"
                          name="description"
                          data-error="Please, Write a description"
                          required
                        ></textarea>
                        <span
                          ng-show="PrayForm.description.$dirty && PrayForm.description.$touched && !PrayForm.description.$valid && !PrayForm.description.$pristine"
                          >Please, Write a description.</span
                        >
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group required">
                        <label for="from">Date</label>
                        <input
                          type="date"
                          ng-model="PrayCtrl.editPray.date"
                          min="PrayCtrl.today"
                          placeholder="From"
                          class="form-control"
                          id="from"
                          name="from"
                          data-error="Please, Select from date"
                          required
                        />
                        <span
                          ng-show="PrayForm.from.$dirty && PrayForm.from.$touched && !PrayForm.from.$valid && !PrayForm.from.$pristine"
                          >Please, Select from date.</span
                        >
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group required">
                        <label for="hour">Time</label>
                        <input
                          type="time"
                          id="hour"
                          name="hour"
                          ng-model="PrayCtrl.editPray.date"
                          placeholder="HH:mm"
                          class="form-control"
                          data-error="Please, Select and hour"
                          required
                        />
                        <span
                          ng-show="PrayForm.hour.$dirty && PrayForm.hour.$touched && !PrayForm.hour.$valid && !PrayForm.hour.$pristine"
                          >Please, Select an hour.</span
                        >
                      </div>
                    </div>
                          

                        <center>
                            <button 
                                ng-show="prayForm.$valid || PrayCtrl.loading"  
                                class="btn btn-oscuro" 
                                ng-disabled="PrayCtrl.loading">
                                    <i ng-show="PrayCtrl.loading" class="fa fa-circle-o-notch fa-spin"></i> 
                                    Update
                            </button>
                            
                        </center>
                    </form>
                    <center>
                    <button ng-click="PrayCtrl.deletePrayEditing(PrayCtrl.editPray)"
                            class="btn btn-danger" 
                            ng-disabled="PrayCtrl.loading">
                            <i ng-show="PrayCtrl.loading" class="fa fa-circle-o-notch fa-spin"></i> 
                            Delete
                    </button>
                    </center>
        </div>
        <div class="col-md-12">
            <a ui-sref="dashboard.controlsPray" class="btn btn-danger"><i class="fa fa-arrow-left"></i> Back</a>
        </div>
    </div>
</div>
