<div
  id="main"
  ng-controller="PraysController as PrayCtrl"
  ng-init="PrayCtrl.queryPrays()"
>
  <div class="row">
    <div class="col-md-12">
      <div class="page-header">
        <center>
          <h2><i class="fas fa-clock"></i> Schedule</h2>
        </center>
      </div>
    </div>
    <div class="col-md-2">
      <button
        type="button"
        ng-if="sidebar.permisos.delete && sidebar.downloadEnable"
        class="btn btn-default"
        ng-csv="PrayCtrl.user_types"
        filename="Prays.csv"
        charset="utf-8"
      >
        <span class="glyphicon glyphicon-download-alt">&nbsp;</span>Download CSV
      </button>
    </div>
    <div class="col-md-2 col-md-offset-6">
      <a
        ng-if="sidebar.permisos.write"
        ui-sref="dashboard.controlsPray"
        class="btn btn-oscuro btn-block"
        >See List</a
      >
    </div>
    <div class="col-md-2">
      <a
        ng-if="sidebar.permisos.write"
        ui-sref="dashboard.addPray"
        class="btn btn-oscuro btn-block"
        >New Appointment</a
      >
    </div>
    <br class="visible-xs visible-sm" />
    <div class="col-md-12">
      <center><h3>{{PrayCtrl.viewDate |  date:"EEEE, MMMM d, y"}}<br><small>{{PrayCtrl.viewDate | date:"HH:mma"}}</small></h3></center>
    </div>
    <div class="col-md-12">
      <div class="btn-group">
        <button
          class="btn btn-oscuro"
          mwl-date-modifier
          date="PrayCtrl.viewDate"
          decrement="PrayCtrl.calendarView"
          ng-click="PrayCtrl.cellIsOpen = false"
        >
          Previous
        </button>
        <button
          class="btn btn-default"
          mwl-date-modifier
          date="PrayCtrl.viewDate"
          set-to-today
          ng-click="PrayCtrl.cellIsOpen = false"
        >
          Today
        </button>
        <button
          class="btn btn-oscuro"
          mwl-date-modifier
          date="PrayCtrl.viewDate"
          increment="PrayCtrl.calendarView"
          ng-click="PrayCtrl.cellIsOpen = false"
        >
          Next
        </button>
      </div>
      <div class="btn-group">
        <label
          class="btn btn-oscuro"
          ng-model="PrayCtrl.calendarView"
          uib-btn-radio="'month'"
          ng-click="PrayCtrl.cellIsOpen = false"
          >Month</label
        >
        <label
          class="btn btn-oscuro"
          ng-model="PrayCtrl.calendarView"
          uib-btn-radio="'week'"
          ng-click="PrayCtrl.cellIsOpen = false"
          >Week</label
        >
        <label
          class="btn btn-oscuro"
          ng-model="PrayCtrl.calendarView"
          uib-btn-radio="'day'"
          ng-click="PrayCtrl.cellIsOpen = false"
          >Day</label
        >
      </div>
    </div>

    <br class="visible-xs visible-sm" />
    <div class="col-md-12">
      <mwl-calendar
        view="PrayCtrl.calendarView"
        view-date="PrayCtrl.viewDate"
        events="PrayCtrl.events"
        view-title="calendarTitle"
        day-view-start="06:00"
        day-view-end="22:59"
        day-view-split="30"
        on-event-click="PrayCtrl.eventClicked(calendarEvent)"
        on-event-times-changed="calendarEvent.startsAt = calendarNewEventStart; calendarEvent.endsAt = calendarNewEventEnd"
        cell-is-open="true"
      >
      </mwl-calendar>
    </div>
  </div>
</div>
