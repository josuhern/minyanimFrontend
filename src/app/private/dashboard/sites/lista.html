<div id="main" ng-controller="SitesController as siteCtrl" ng-init="siteCtrl.querySites()">
		<div class="row">
			<div class="col-md-12">
                <div class="page-header">
                    <center><h3><i class="fas fa-synagogue"></i> Synagogues</h3></center>
                </div>
            </div>
            <div class="col-md-2">
             <button type="button" ng-if="sidebar.permisos.delete && sidebar.downloadEnable" class="btn btn-default" ng-csv="siteCtrl.sites" filename="Sucursales.csv" charset="utf-8"><span class="glyphicon glyphicon-download-alt">&nbsp;</span>Download CSV</button>
           </div>
            <div class="col-md-2 col-md-offset-8">
                <a ng-if="sidebar.permisos.write" ui-sref="dashboard.sucursalAlta" class="btn btn-oscuro btn-block">New Synagogue</a>
            </div>
            <div class="col-md-12">
                <div class="table-responsive">
                <div ng-repeat="alert in alerts" type="alert.type" class="alert alert-{{alert.type}}"><strong>{{ alert.msg }}</strong></div>
                  <table class="table" ng-table="siteCtrl.tableParams" show-filter="true">
                      <tbody>
                          <tr ng-repeat="x in $data">
                              <td data-title="'Name'" filter="{name: 'text'}" data-sortable="'name'">{{x.name}}</td>
                              <td data-title="'Address'" filter="{address: 'text'}" data-sortable="'address'">{{x.address}}</td>
                              <td data-title="'Phone'" filter="{phone: 'text'}" data-sortable="'phone'">{{x.phone}}</td>
                              <td ng-if="sidebar.permisos.delete && sidebar.deleteEnable"><button class="btn btn-danger btn-block" ng-click="siteCtrl.deleteSite(x)">Delete</button></td>
                              <td ng-if="sidebar.permisos.edit"><a class="btn btn-warning btn-block" ui-sref="dashboard.sucursalEditar({id: x.id})">Edit</a></td>
                              <td ng-if="sidebar.permisos.read"><a class="btn btn-success btn-block" ui-sref="dashboard.sucursalVista({id: x.id})">More</a></td>
                          </tr>
                      </tbody>
                  </table>
                </div>
            </div>
	    </div>
    </div>
