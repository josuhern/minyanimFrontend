<div id="main" ng-controller="UserTypesController as userTypeCtrl">
    <div class="row">
        <div class="col-md-12">
            <div class="page-header">
                <center><h1><i class="fa fa-cubes"></i> New User Type</h1></center>
            </div>
        </div>
        <div class="col-md-12">
            <form class="form-style" name="userTypeForm" ng-submit="userTypeForm.$valid && userTypeCtrl.saveUserType(userTypeForm)" novalidate>
                <div ng-repeat="alert in alerts" type="alert.type" class="alert alert-{{alert.type}}"><strong>{{ alert.msg }}</strong></div>
                        <div class="col-md-12">
                            <div class="form-group">
                                <input type="text" ng-model="userTypeCtrl.newUserTypes.name" placeholder="Name" class="form-control" id="name" name="name" data-error="Please, Write a name" required>
                                <span ng-show="userTypeForm.name.$dirty && userTypeForm.name.$touched && !userTypeForm.name.$valid && !userTypeForm.name.$pristine">Please, Write a name.</span>
                            </div>
                        </div>
                        <center><button ng-show="userTypeForm.$valid || userTypeCtrl.loading"  class="btn btn-oscuro" ng-disabled="userTypeCtrl.loading"><i ng-show="userTypeCtrl.loading" class="fa fa-circle-o-notch fa-spin"></i> Save</button></center>
                    </form>
        </div>
        <div class="col-md-12">
            <a ui-sref="dashboard.tipoUsuarioLista" class="btn btn-danger"><i class="fa fa-arrow-left"></i> Back</a>
        </div>
    </div>
</div>
